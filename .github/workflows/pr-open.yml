name: PR

on:
  pull_request:

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: pr-${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  builds:
    name: Builds
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      id-token: write
      packages: write
    strategy:
      matrix:
        package: [backend, backend-postgres, frontend]
        include:
          - package: backend
            build_context: backend
            extra_build_arg: PRIMARY_DB=oracle
            triggers: ('backend/')
          - package: backend-postgres
            build_context: backend
            extra_build_arg: PRIMARY_DB=postgres
            triggers: ('backend/')
          - package: frontend
            build_context: frontend
            extra_build_arg: ''
            triggers: ('frontend/')
    steps:
      - uses: actions/checkout@v6
      - uses: bcgov/action-builder-ghcr@cb2629351c87dd1c2130073e4ebb7233a9653a63 # v4.4.1
        with:
          package: ${{ matrix.package }}
          build_context: ${{ matrix.build_context }}
          build_file: ${{ matrix.build_context }}/Dockerfile
          token: ${{ secrets.GITHUB_TOKEN }}
          triggers: ${{ matrix.triggers }}
          tags: ${{ github.event.number }}
          tag_fallback: latest
          build_args: |
            BUILDKIT_INLINE_CACHE=1
            ${{ matrix.extra_build_arg }}

  fam_routes:
    name: Allocate FAM Routes
    concurrency:
      group: fam-routes-global
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    outputs:
      hybrid_route_number: ${{ steps.allocate.outputs.route_hybrid }}
      postgres_route_number: ${{ steps.allocate.outputs.route_postgres }}
    steps:
      - uses: actions/checkout@v6
      - name: Allocate FAM routes
        id: allocate
        uses: ./.github/actions/allocate-fam-routes
        with:
          oc_token: ${{ secrets.OC_TOKEN }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          pr_number: ${{ github.event.number }}

  deploys:
    name: Deploys (${{ github.event.number }})
    needs: [builds, fam_routes]
    strategy:
      matrix:
        primary_db: [oracle, postgres]
        include:
          - primary_db: oracle
            fam_route: ${{ needs.fam_routes.outputs.hybrid_route_number }}
            deployment_model: hybrid
          - primary_db: postgres
            fam_route: ${{ needs.fam_routes.outputs.postgres_route_number }}
            deployment_model: postgres
    secrets: inherit
    uses: ./.github/workflows/.deploy.yml
    with:
      backend_cpu_request: "30m"
      backend_min_replicas: "1"
      backend_max_replicas: "1"
      backend_primary_db: "${{ matrix.primary_db }}"
      fam_route: "${{ matrix.fam_route }}"
      target: "${{ github.event.number }}-${{ matrix.deployment_model }}"
      deployment_model: ${{ matrix.deployment_model }}
      triggers: ''

  cleanup_configmap:
    name: Cleanup ConfigMap After Deployment (${{ github.event.number }})
    needs: [fam_routes, deploys]
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Remove route reservations from ConfigMap
        uses: bcgov/action-oc-runner@v1.7.0
        env:
          PR_NUMBER: ${{ github.event.number }}
          HYBRID_ROUTE: ${{ needs.fam_routes.outputs.hybrid_route_number }}
          POSTGRES_ROUTE: ${{ needs.fam_routes.outputs.postgres_route_number }}
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          commands: |
            echo "Deployment successful - removing route reservations from ConfigMap"
            echo "PR: $PR_NUMBER, Hybrid route: $HYBRID_ROUTE, Postgres route: $POSTGRES_ROUTE"
            
            # Check if ConfigMap exists
            if ! oc get configmap fam-route-allocations &>/dev/null; then
              echo "ConfigMap fam-route-allocations does not exist, nothing to clean up"
              exit 0
            fi
            
            # Remove hybrid route reservation
            if [[ -n "$HYBRID_ROUTE" ]]; then
              oc patch configmap fam-route-allocations --type merge \
                -p "{\"data\": {\"hybrid_${HYBRID_ROUTE}\": null}}" || true
              echo "Removed hybrid route $HYBRID_ROUTE reservation"
            fi
            
            # Remove postgres route reservation
            if [[ -n "$POSTGRES_ROUTE" ]]; then
              oc patch configmap fam-route-allocations --type merge \
                -p "{\"data\": {\"postgres_${POSTGRES_ROUTE}\": null}}" || true
              echo "Removed postgres route $POSTGRES_ROUTE reservation"
            fi

  load_test_data:
    name: Load Dev Test Data (${{ github.event.number }})
    needs: [deploys]
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FLYWAY_VERSION: "10.13.0"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Cache Flyway CLI
        id: cache-flyway
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flyway
          key: flyway-cli-${{ env.FLYWAY_VERSION }}-linux-x64

      - name: Install Flyway CLI
        if: steps.cache-flyway.outputs.cache-hit != 'true'
        run: |
          FLYWAY_DIR="${{ runner.temp }}/flyway"
          mkdir -p "$FLYWAY_DIR"
          curl -sSLo /tmp/flyway.tar.gz "https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/${FLYWAY_VERSION}/flyway-commandline-${FLYWAY_VERSION}-linux-x64.tar.gz"
          tar -xzf /tmp/flyway.tar.gz -C "$FLYWAY_DIR" --strip-components=1
          chmod -R +rx "$FLYWAY_DIR"
          rm -f /tmp/flyway.tar.gz

      - name: Apply Dev Test Data to PostgreSQL Pod
        uses: bcgov/action-oc-runner@v1.7.0
        env:
          PR_NUMBER: ${{ github.event.number }}
          FLYWAY_CMD: ${{ runner.temp }}/flyway/flyway
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          commands: |
            echo "Starting Flyway dev test data load for PR $PR_NUMBER (PostgreSQL)"
            echo "Git branch: $(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo 'detached') ($(git rev-parse --short HEAD 2>/dev/null || echo 'unknown'))"

            TARGET_ZONE="${PR_NUMBER}-postgres"
            SECRET_NAME="nr-silva-${TARGET_ZONE}-database"
            SERVICE_NAME="service/nr-silva-${TARGET_ZONE}-database"
            LOCAL_PORT=54332

            # Retrieve database credentials from OpenShift secret
            echo "Retrieving PostgreSQL credentials from secret $SECRET_NAME..."
            DB_NAME=$(oc get secret "$SECRET_NAME" -o jsonpath='{.data.database-name}' | base64 -d)
            DB_USER=$(oc get secret "$SECRET_NAME" -o jsonpath='{.data.database-user}' | base64 -d)
            DB_PASS=$(oc get secret "$SECRET_NAME" -o jsonpath='{.data.database-password}' | base64 -d)

            # Mask database credentials in GitHub Actions output
            echo "::add-mask::$DB_PASS"

            if [[ -z "$DB_NAME" || -z "$DB_USER" || -z "$DB_PASS" ]]; then
              echo "Error: Failed to retrieve PostgreSQL database credentials from secret $SECRET_NAME" >&2
              exit 1
            fi

            echo "Connecting to $SERVICE_NAME via port-forward on port $LOCAL_PORT..."
            oc port-forward --address 127.0.0.1 "$SERVICE_NAME" "${LOCAL_PORT}:5432" &
            PF_PID=$!

            # Ensure port-forward process is terminated when script exits
            trap 'echo "Stopping port-forward (PID: $PF_PID)..."; kill $PF_PID 2>/dev/null || true' EXIT

            # Wait for port-forward to become available
            echo "Waiting for port-forward to open on port $LOCAL_PORT..."
            READY=0
            for i in $(seq 1 30); do
              if ss -tln | grep -q ":$LOCAL_PORT " || (echo > /dev/tcp/127.0.0.1/$LOCAL_PORT) 2>/dev/null; then
                READY=1
                echo "Port-forward established successfully."
                break
              fi
              sleep 1
            done

            if [[ "$READY" -ne 1 ]]; then
              echo "Error: Timed out waiting for port-forward on port $LOCAL_PORT" >&2
              exit 1
            fi

            echo "Executing Flyway migrate with dev test data..."
            export FLYWAY_URL="jdbc:postgresql://127.0.0.1:${LOCAL_PORT}/${DB_NAME}"
            export FLYWAY_USER="${DB_USER}"
            export FLYWAY_PASSWORD="${DB_PASS}"

            "$FLYWAY_CMD" \
              -schemas="silva" \
              -defaultSchema="silva" \
              -baselineOnMigrate=true \
              -validateOnMigrate=false \
              -connectRetries=10 \
              -locations="filesystem:${GITHUB_WORKSPACE}/backend/src/main/resources/db/migration,filesystem:${GITHUB_WORKSPACE}/backend/src/main/resources/db/migration-dev,filesystem:${GITHUB_WORKSPACE}/backend/src/test/resources/migration/postgres/default,filesystem:${GITHUB_WORKSPACE}/backend/src/test/resources/migration/postgres/dev" \
              migrate

            echo "Flyway dev test data migration completed successfully."

  # ==========================================================================
  # WARNING: This job acts as the required merge gate for this workflow.
  # If you add a new job to this workflow, you MUST add its ID to the 'needs'
  # array below, otherwise its failure or cancellation will not block the PR!
  # ==========================================================================
  results:
    name: PR Results
    needs: [builds, fam_routes, deploys, load_test_data]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Log Job Results Context
        run: |
          echo "=== Upstream Job Statuses ==="
          echo '${{ toJson(needs) }}'

      - name: Evaluate Overall Status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "❌ Critical Check Failure: At least one required job has failed or was cancelled."
          exit 1

      - name: Success Message
        run: echo "✅ All critical checks passed or were intentionally skipped!"
