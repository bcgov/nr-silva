spring:
  flyway:
    enabled: false
  # BC Gov SSO Keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev.loginproxy.gov.bc.ca/auth/realms/standard
          jwk-set-uri: https://dev.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/certs
          client-id: nr-silva
  jpa:
    show-sql: true

silva:
  integrations:
    external-oracle:
      enabled: false

# Users allowed to see and download WMS layers information
ca:
  bc:
    gov:
      nrs:
        dashboard-job-users: ${DASHBOARD_JOB_IDIR_USERS:NONE}
        wms-whitelist: ${WMS_LAYERS_WHITELIST_USERS:NONE}

        forest-client-api:
          address: http://localhost:10000
          key: 123456789abcdef
        open-maps:
          address: http://localhost:10001

logging:
  level:
    #root: DEBUG
    ca.bc.gov.restapi.results: ${LOGGING_LEVEL:INFO}
    org.springframework.web.client: DEBUG
    org.springframework.http.client: DEBUG
